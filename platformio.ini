[env:lolin_d1_mini]  ; <<< GANTI NAMA ENVIRONMENT
platform = espressif8266
board = d1_mini      ; <<< INI YANG BENAR UNTUK LOLIN
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    ESP Async WebServer@1.2.3
    AsyncTCP@1.1.1
    ESP8266WiFi
    ArduinoJson@6.21.3
    Ticker
    ESP8266mDNS

build_flags = 
    -Wno-error=maybe-uninitialized
    -DASYNC_TCP_SSL_ENABLED=0
    -DESP8266
    -DARDUINO_ESP8266_D1_MINI
    -DXYRON_STEALTH_MODE
    -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED

; LOLIN D1 Mini specific settings
board_build.ldscript = eagle.flash.4m1m.ld
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_upload.maximum_size = 4194304  ; 4MB flash

; Upload port - sesuaikan dengan device lu
upload_port = /dev/ttyUSB0
; Untuk Windows: COM3
; Untuk Mac: /dev/cu.usbserial-*

